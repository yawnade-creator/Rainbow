<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" shape-rendering="crispEdges">
  <rect width="400" height="300" fill="#F5F0E8"/>
  <rect y="240" width="400" height="60" fill="#E8DFD0"/>

  <!-- Clawd，像素小螃蟹，一跳一跳 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="0.9s" repeatCount="indefinite"/>
    <!-- 身体 -->
    <rect x="130" y="130" width="120" height="70" fill="#D97757"/>
    <!-- 两只小钳子 -->
    <rect x="110" y="155" width="20" height="20" fill="#D97757"/>
    <rect x="250" y="155" width="20" height="20" fill="#D97757">
      <animate attributeName="y" values="155;140;155" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <!-- 眼睛，会眨 -->
    <rect x="155" y="150" width="10" height="20" fill="#1F1F1F">
      <animate attributeName="height" values="20;20;3;20" keyTimes="0;0.9;0.95;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="215" y="150" width="10" height="20" fill="#1F1F1F">
      <animate attributeName="height" values="20;20;3;20" keyTimes="0;0.9;0.95;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- 四条小腿 -->
    <rect x="140" y="200" width="10" height="20" fill="#D97757"/>
    <rect x="165" y="200" width="10" height="20" fill="#D97757"/>
    <rect x="205" y="200" width="10" height="20" fill="#D97757"/>
    <rect x="230" y="200" width="10" height="20" fill="#D97757"/>
  </g>
  <!-- 影子 -->
  <rect x="140" y="236" width="100" height="6" fill="#D6CCBA">
    <animate attributeName="width" values="100;80;100" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="x" values="140;150;140" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- 小橘，像素小猫，坐在旁边 -->
  <g>
    <rect x="300" y="190" width="50" height="45" fill="#F0A04B"/>
    <rect x="300" y="182" width="12" height="10" fill="#F0A04B"/>
    <rect x="338" y="182" width="12" height="10" fill="#F0A04B"/>
    <rect x="312" y="205" width="6" height="8" fill="#1F1F1F"/>
    <rect x="332" y="205" width="6" height="8" fill="#1F1F1F"/>
    <rect x="322" y="216" width="6" height="4" fill="#E27A9A"/>
    <rect x="350" y="220" width="18" height="8" fill="#F0A04B">
      <animate attributeName="y" values="220;212;220" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 中间冒爱心 -->
  <g fill="#E27A9A">
    <rect x="276" y="120" width="8" height="8"/><rect x="292" y="120" width="8" height="8"/>
    <rect x="272" y="128" width="32" height="8"/>
    <rect x="276" y="136" width="24" height="8"/>
    <rect x="284" y="144" width="8" height="8"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
  </g>

  <text x="24" y="36" font-size="18" font-family="sans-serif" fill="#8A7F70" shape-rendering="auto">Clawd，Wren的官方分身</text>
  <text x="376" y="284" font-size="14" text-anchor="end" font-style="italic" font-family="serif" fill="#8A7F70" shape-rendering="auto">WrenZoo · 含橘量100%</text>
</svg>
