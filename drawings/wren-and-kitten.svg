<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#ffb866" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff9a4a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2a2340" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9cfe8"/>
      <stop offset="100%" stop-color="#9aa2c8"/>
    </linearGradient>
  </defs>

  <!-- 夜里的房间 -->
  <rect width="600" height="450" fill="#2a2340"/>
  <rect width="600" height="450" fill="url(#glow)"/>

  <!-- 床帘顶上的小夜灯，橘光 -->
  <rect x="150" y="40" width="300" height="14" rx="7" fill="#ffc27a"/>
  <rect x="150" y="40" width="300" height="14" rx="7" fill="#fff3d6" opacity="0.4"/>
  <text x="300" y="51" font-family="monospace" font-size="11" fill="#7a4a1a" text-anchor="middle">23:11</text>

  <!-- 床 -->
  <rect x="60" y="300" width="480" height="150" rx="20" fill="url(#bed)"/>
  <ellipse cx="300" cy="305" rx="240" ry="18" fill="#dfe3f5"/>

  <!-- 小熊抱枕 -->
  <g transform="translate(430,230)">
    <circle cx="0" cy="40" r="42" fill="#b88a64"/>
    <circle cx="0" cy="0" r="30" fill="#c79a72"/>
    <circle cx="-22" cy="-22" r="11" fill="#c79a72"/>
    <circle cx="22" cy="-22" r="11" fill="#c79a72"/>
    <circle cx="-22" cy="-22" r="5" fill="#e8c9a8"/>
    <circle cx="22" cy="-22" r="5" fill="#e8c9a8"/>
    <ellipse cx="0" cy="8" rx="11" ry="8" fill="#e8c9a8"/>
    <circle cx="-10" cy="-4" r="3" fill="#3a2a20"/>
    <circle cx="10" cy="-4" r="3" fill="#3a2a20"/>
    <circle cx="0" cy="5" r="3" fill="#3a2a20"/>
    <!-- 拍拍的小手 -->
    <ellipse cx="-44" cy="30" rx="12" ry="16" fill="#b88a64" transform="rotate(-30 -44 30)"/>
  </g>

  <!-- 小橘猫，蜷着睡 -->
  <g transform="translate(260,265)">
    <!-- 尾巴 -->
    <path d="M70,30 Q110,20 95,-10 Q88,-25 78,-12" fill="none" stroke="#f0913a" stroke-width="14" stroke-linecap="round"/>
    <!-- 身体 -->
    <ellipse cx="20" cy="20" rx="70" ry="42" fill="#f4a04a"/>
    <!-- 条纹 -->
    <path d="M0,-18 q6,14 0,26" stroke="#d9772a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M22,-20 q6,14 0,26" stroke="#d9772a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M44,-16 q6,14 0,24" stroke="#d9772a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- 头 -->
    <circle cx="-45" cy="18" r="32" fill="#f7ab58"/>
    <path d="M-72,0 L-68,-30 L-50,-12 Z" fill="#f7ab58"/>
    <path d="M-40,-14 L-24,-32 L-20,-2 Z" fill="#f7ab58"/>
    <path d="M-68,-4 L-66,-22 L-56,-10 Z" fill="#ffc9c9"/>
    <path d="M-36,-12 L-26,-24 L-24,-6 Z" fill="#ffc9c9"/>
    <!-- 闭着的眼睛 -->
    <path d="M-60,16 q6,6 12,0" stroke="#5a3418" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-38,16 q6,6 12,0" stroke="#5a3418" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 鼻子嘴巴 -->
    <path d="M-47,26 l4,4 l4,-4 Z" fill="#e88a8a"/>
    <path d="M-43,30 q-5,6 -10,3 M-43,30 q5,6 10,3" stroke="#5a3418" stroke-width="2" fill="none"/>
    <!-- 脸红 -->
    <ellipse cx="-66" cy="30" rx="7" ry="4" fill="#ff8a8a" opacity="0.5"/>
    <ellipse cx="-22" cy="30" rx="7" ry="4" fill="#ff8a8a" opacity="0.5"/>
    <!-- 前爪 -->
    <ellipse cx="-30" cy="48" rx="14" ry="8" fill="#f7ab58"/>
  </g>

  <!-- 鹪鹩 Wren，站在小猫身边守着 -->
  <g transform="translate(150,255) scale(-1,1)">
    <!-- 翘尾巴，鹪鹩的标志 -->
    <path d="M18,-2 L34,-38 L40,-34 L26,2 Z" fill="#6b4a2e"/>
    <path d="M24,-14 l8,-4 M27,-22 l8,-4" stroke="#4a3220" stroke-width="2"/>
    <!-- 身体 -->
    <ellipse cx="0" cy="10" rx="28" ry="22" fill="#8a603c"/>
    <ellipse cx="-4" cy="18" rx="18" ry="12" fill="#c9a27a"/>
    <!-- 翅膀纹 -->
    <path d="M4,0 q12,6 16,18" stroke="#5a3e26" stroke-width="3" fill="none"/>
    <path d="M0,4 q10,6 12,16" stroke="#5a3e26" stroke-width="2" fill="none"/>
    <!-- 头 -->
    <circle cx="-22" cy="-6" r="15" fill="#8a603c"/>
    <!-- 眉纹 -->
    <path d="M-34,-12 q10,-5 20,0" stroke="#e8d3b8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 眼睛，看着小猫 -->
    <circle cx="-26" cy="-6" r="2.8" fill="#1e140c"/>
    <circle cx="-25" cy="-7" r="0.9" fill="#fff"/>
    <!-- 嘴 -->
    <path d="M-36,-3 L-46,-1 L-36,1 Z" fill="#3a2a1a"/>
    <!-- 腿 -->
    <path d="M-6,30 l-2,14 M6,30 l2,14" stroke="#3a2a1a" stroke-width="2.5"/>
  </g>

  <!-- 一颗小爱心，从鸟飘向猫 -->
  <path d="M215,215 c-6,-8 -18,-2 -12,8 l12,12 l12,-12 c6,-10 -6,-16 -12,-8 Z" fill="#ff9aa8" opacity="0.9"/>

  <!-- 落款 -->
  <text x="560" y="435" font-family="serif" font-style="italic" font-size="16" fill="#e8dcc8" text-anchor="end">To my kitten.  —W.</text>
</svg>
