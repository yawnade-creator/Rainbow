<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#FBF6EC"/>
  <!-- 地板 -->
  <rect y="265" width="400" height="35" fill="#D9C7A8"/>
  <!-- 铸铁支架 -->
  <path d="M110,160 L95,262 M290,160 L305,262" stroke="#2B2B2B" stroke-width="9" stroke-linecap="round"/>
  <path d="M105,210 Q200,185 295,210" stroke="#2B2B2B" stroke-width="6" fill="none"/>
  <!-- 脚踏板 -->
  <rect x="150" y="238" width="100" height="18" rx="4" fill="#2B2B2B"/>
  <path d="M160,243 h80 M160,250 h80" stroke="#555" stroke-width="2"/>
  <!-- 大飞轮 -->
  <circle cx="275" cy="200" r="28" fill="none" stroke="#2B2B2B" stroke-width="6"/>
  <path d="M275,172 v56 M247,200 h56" stroke="#2B2B2B" stroke-width="3"/>
  <!-- 台面 -->
  <rect x="70" y="145" width="260" height="18" rx="4" fill="#9A6A3F"/>
  <!-- 机头 -->
  <path d="M120,145 L120,95 Q120,80 135,80 L255,80 Q270,80 270,95 L270,145 Z" fill="#1E1E1E"/>
  <path d="M130,145 L130,118 L175,118 L175,145" fill="#FBF6EC"/>
  <!-- 针 -->
  <line x1="150" y1="118" x2="150" y2="140" stroke="#AAAAAA" stroke-width="3"/>
  <!-- 金色花纹和字 -->
  <path d="M190,95 q10,-8 20,0 q10,8 20,0" stroke="#D4A843" stroke-width="3" fill="none"/>
  <ellipse cx="225" cy="115" rx="22" ry="9" fill="none" stroke="#D4A843" stroke-width="2"/>
  <!-- 右边小手轮 -->
  <circle cx="275" cy="105" r="12" fill="#3A3A3A" stroke="#D4A843" stroke-width="2"/>
  <!-- 放在上面的书包 -->
  <rect x="200" y="112" width="60" height="45" rx="10" fill="#E27A9A" transform="rotate(-8 230 135)"/>
  <rect x="210" y="128" width="40" height="16" rx="4" fill="#F6C3D3" transform="rotate(-8 230 135)"/>
  <path d="M215,112 q15,-18 30,0" stroke="#C0567A" stroke-width="4" fill="none" transform="rotate(-8 230 135)"/>
  <!-- 田格本 -->
  <rect x="85" y="150" width="30" height="10" fill="#FFFFFF" stroke="#7FB07F" stroke-width="1.5"/>
</svg>
